<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Icon test</title>
<style>
:root { --bg: #1c1c1c; --text: #ececec; --muted: #9a9a9a;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--font); }
main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 40px; font-weight: 600; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 32px; }
p a { color: var(--text); }
#big { width: 256px; height: 256px; display: block; margin-bottom: 32px; }
.bars { display: grid; gap: 8px; }
.bar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-radius: 8px; }
.bar span { font-size: 13px; width: 150px; }
.bar img.s32 { width: 32px; height: 32px; }
.bar img.s16 { width: 16px; height: 16px; }
.light { color: #333; } .dark { color: #bbb; }
</style>
</head>
<body>
<main>
<h1 id="code">Icon test</h1>
<p id="note">Add icons to Test on <a href="/#test">the board</a> and open their links from there.</p>
<img id="big" alt="" hidden>
<div class="bars" id="bars"></div>
</main>
<script>
// One test page for every icon on the board (user, 2026-11-10: "drop it into bookmarks and see how it looks"):
// /t/?<code> reads the icon from the board's data with the access kept by the board in this browser, makes it this
// tab's icon and the code the page title, so a bookmark shows that icon under that code. Nothing is copied or published.
// Only icons in the board's Test (test.json) are shown: taking an icon out of Test there ends its page here.
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = decodeURIComponent(location.search.slice(1) || location.hash.slice(1)).trim();
  if (!q) return;
  var access = null; try { access = localStorage.getItem('board-access'); } catch (e) {}
  var parts = (access || '').trim().split(/\s+/), token = parts[0], repo = parts[1];
  if (!token || !repo) { $('note').innerHTML = 'Not signed in: open <a href="/">the board</a> once in this browser.'; return; }
  var API = 'https://api.github.com/repos/' + repo + '/contents/';
  var raw = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw' };
  var norm = function (c) { var m = String(c).toUpperCase().replace(/\s/g, '').match(/^([A-Z]+)-?(\d+|[A-Z]+\d*)$/); return m ? m[1] + '-' + m[2] : String(c).toUpperCase(); };
  var shown = function (c) { return c.toLowerCase().replace('-', ''); };
  var get = function (f) { return fetch(API + f, { headers: raw, cache: 'no-store' }).then(function (r) {
    if (r.status === 404 && f === 'test.json') return [];
    if (!r.ok) throw new Error('the board data answered ' + r.status);
    return r.json();
  }); };
  Promise.all([get('index.json'), get('test.json')]).then(function (res) {
    var data = res[0], tests = res[1];
    var code = norm(q), was = data.was || {};
    if (was[code]) code = norm(was[code]);
    var it = data.items.filter(function (x) { return x.code.toUpperCase() === code; })[0];
    if (!it) throw new Error('no icon ' + shown(code) + ' on the board');
    if (tests.indexOf(it.code) < 0) { document.title = shown(it.code) + ' (not in Test)'; $('code').textContent = shown(it.code);
      $('note').innerHTML = 'Not in Test any more. Add it again on <a href="/#test">the board</a> to see it here.'; return; }
    var ext = it.path.split('.').pop().toLowerCase();
    var type = { svg: 'image/svg+xml', png: 'image/png', ico: 'image/x-icon', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp' }[ext] || 'image/png';
    return fetch(API + it.path, { headers: raw }).then(function (r) {
      if (!r.ok) throw new Error(it.path + ' answered ' + r.status);
      return r.blob();
    }).then(function (b) {
      return new Promise(function (ok) { var f = new FileReader(); f.onload = function () { ok(f.result); }; f.readAsDataURL(new Blob([b], { type: type })); });
    }).then(function (url) {
      var c = shown(it.code);
      document.title = c;
      var link = document.createElement('link'); link.rel = 'icon'; link.type = type; link.href = url;
      document.head.appendChild(link);
      $('code').textContent = c;
      $('note').textContent = [it.title, it.batch, it.status === 'live' ? 'live on ' + it.where : it.status].filter(Boolean).join(' · ');
      $('big').src = url; $('big').hidden = false;
      // the bars an icon sits on (values as on the board): Chrome light bar and tab, Chrome dark bar and tab, Firefox dark
      [['Chrome light bar', '#dee1e6', 'light'], ['Chrome light tab', '#ffffff', 'light'], ['Chrome dark bar', '#202124', 'dark'],
       ['Chrome dark tab', '#3c3c3c', 'dark'], ['Firefox dark', '#2b2a33', 'dark']].forEach(function (b) {
        var d = document.createElement('div'); d.className = 'bar ' + b[2]; d.style.background = b[1];
        var s = document.createElement('span'); s.textContent = b[0]; d.appendChild(s);
        ['s32', 's16'].forEach(function (k) { var i = document.createElement('img'); i.className = k; i.src = url; i.alt = ''; d.appendChild(i); });
        $('bars').appendChild(d);
      });
    });
  }).catch(function (e) { $('note').textContent = 'Could not show ' + q + ': ' + e.message + '.'; });
})();
</script>
</body>
</html>
