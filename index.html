<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Logo board</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #1c1c1c; --side: #181818; --card: #262626; --hover: #2e2e2e; --line: #303030;
  --text: #ececec; --muted: #9a9a9a; --faint: #6c6c6c;
  --tag: #8a8a8a;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }

/* sign in */
#login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; background: var(--bg); z-index: 50; }
#login form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px 24px; }
#login img { width: 44px; height: 44px; display: block; margin-bottom: 14px; border-radius: 9px; }
#login h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
#login p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
#login .why { color: #f08a7a; }
#login input { display: block; width: 100%; margin-bottom: 10px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; outline: none; }
#login input:focus { border-color: #555; }
#login button { width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #444; border-radius: 10px; background: var(--hover); font-weight: 500; cursor: pointer; }

/* frame */
#app { display: none; height: 100%; }
#side { width: 264px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; padding: 14px 10px; }
.brand { padding: 4px 10px 14px; font-size: 16px; font-weight: 500; color: var(--muted); }
.label { padding: 14px 10px 6px; color: var(--muted); font-size: 13px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; color: #cfcfcf; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; }
.nav:hover { background: var(--hover); }
.nav.on { background: #2c2c2c; color: var(--text); }
.nav.drag { opacity: .4; }
.nav.drop-above { box-shadow: inset 0 2px 0 #777; }
.nav.drop-below { box-shadow: inset 0 -2px 0 #777; }
.nav .n { margin-left: auto; color: var(--faint); font-size: 13px; }
#main { flex: 1; overflow-y: auto; min-width: 0; }
header { position: sticky; top: 0; z-index: 5; background: rgba(28,28,28,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 28px; }
.top { display: flex; align-items: center; gap: 12px; }
#title { font-size: 17px; font-weight: 500; margin: 0; }
#menu { display: none; border: 0; background: none; padding: 4px 6px; cursor: pointer; font-size: 20px; }
#find { margin-left: auto; width: 180px; padding: 7px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
#title { display: none; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
.chip.on { background: var(--hover); color: var(--text); border-color: #444; }
.chip .n { opacity: .65; margin-left: 4px; }
#content { padding: 8px 28px 120px; }
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 22px 0 8px; }
h2 .sub { font-weight: 400; color: var(--faint); margin-left: 6px; }
h2.pickable { cursor: pointer; display: inline-block; border-radius: 6px; padding: 2px 6px; margin-left: -6px; }
h2.pickable:hover { background: var(--hover); color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(101px, 1fr)); gap: 11px; }
.grid .card { margin: 0; }
.grid.free { display: block; columns: 156px; column-gap: 11px; }
.grid.free .card { margin: 0 0 10px; }
.grid.free img { width: 100%; }
.card { break-inside: avoid; margin: 0 0 10px; background: var(--card); border: 1px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; display: block; width: 100%; padding: 0; text-align: left; }
.card:hover { background: var(--hover); }
.card.sel { border-color: #8a8a8a; }
.card .pic { padding: 4px 9px 8px; display: flex; align-items: center; justify-content: center; }
.card.icon .pic { aspect-ratio: 1; }
.card img { max-width: 100%; display: block; }
.card.icon img { width: 100%; height: 100%; object-fit: contain; }
.card.big { column-span: none; }
.card .meta { display: flex; align-items: center; gap: 6px; padding: 8px 9px 0; font-size: 12px; min-height: 26px; color: var(--muted); }
.card .code { font-weight: 500; white-space: nowrap; flex: none; }
.card .t { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { margin-left: auto; font-size: 10px; padding: 0 5px; border-radius: 999px; white-space: nowrap; }
.badge { color: var(--tag); border: 1px solid var(--line); }
.tick { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #888; background: rgba(0,0,0,.35); display: none; }
.card.sel { background: var(--hover); }
.sizes { display: flex; align-items: flex-end; gap: 8px; padding: 0 9px 10px; }
.sizes img { display: block; flex: none; }
.card .sizes .s32 { width: 32px; height: 32px; } .card .sizes .s16 { width: 16px; height: 16px; }
.card.sel .tick { background: #777; border-color: #777; }
.card.sel .tick::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.empty { color: var(--muted); padding: 40px 0; }

/* selection bar */
#bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; align-items: center; gap: 12px; background: #2a2a2a; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 10px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 20; max-width: calc(100% - 32px); }
#bar > * { white-space: nowrap; flex: none; }
#bar .codes { flex: 0 1 auto; min-width: 0; color: var(--muted); font-size: 13px; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 0; border-radius: 10px; padding: 7px 14px; cursor: pointer; background: var(--hover); }
.btn.main { background: #3a3a3a; }

/* detail */
#detail { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
#detail .box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; width: 100%; max-width: 760px; max-height: calc(100% - 32px); overflow-y: auto; display: grid; grid-template-columns: 300px 1fr; }
#detail .view { background: #202020; display: flex; align-items: center; justify-content: center; padding: 22px; min-height: 300px; }
#detail .view img { max-width: 256px; max-height: 420px; width: 100%; object-fit: contain; }
#detail .info { padding: 22px 22px 20px; min-width: 0; }
#detail .head { display: flex; align-items: center; gap: 10px; }
#detail .head .code { font-size: 22px; font-weight: 600; }
#detail .x { margin-left: auto; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
.row { color: var(--muted); font-size: 14px; margin: 4px 0; }
.row b { color: var(--text); font-weight: 500; }
.tabs { margin: 16px 0 6px; display: grid; gap: 8px; }
.tabbar { border-radius: 10px; padding: 7px 8px 0; display: flex; align-items: flex-end; gap: 8px; }
.tabbar .tab { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px 8px 0 0; font: 12px/1 var(--font); }
.tabbar img { width: 16px; height: 16px; }
.tabbar img.x2 { width: 32px; height: 32px; margin-left: auto; align-self: center; margin-bottom: 7px; }
.tabbar.light { background: #dfe1e5; } .tabbar.light .tab { background: #fff; color: #333; }
.tabbar.dark { background: #202124; } .tabbar.dark .tab { background: #35363a; color: #ddd; }
.files { margin-top: 14px; font-size: 13px; }
.files a { display: block; color: var(--muted); padding: 2px 0; text-decoration: none; cursor: pointer; }
.files a:hover { color: var(--text); }
.acts { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
#toast button { margin-left: 12px; border: 0; background: none; text-decoration: underline; cursor: pointer; padding: 0; }
.note { color: var(--faint); font-size: 13px; margin: 10px 0 0; }
#toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); background: #3a3a3a; color: var(--text); padding: 8px 14px; border-radius: 10px; font-size: 14px; display: none; z-index: 60; }


#ctx { position: fixed; z-index: 70; display: none; min-width: 210px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 10px; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 13.5px; }
#ctx button { display: flex; width: 100%; border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
#ctx button:hover { background: #363636; }
#ctx button .k { margin-left: auto; color: var(--faint); padding-left: 16px; }
#ctx hr { border: 0; border-top: 1px solid #3a3a3a; margin: 5px 4px; }
#ctx .head { color: var(--faint); padding: 4px 10px 6px; font-size: 12px; }
@media (max-width: 760px) {
  #side { position: fixed; inset: 0 auto 0 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.5); }
  body.menu #side { transform: none; }
  #menu { display: block; }
  header, #content { padding-left: 16px; padding-right: 16px; }
  #find { width: 120px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 9px; }
  .grid.free { columns: 132px; column-gap: 9px; }
  .card { margin-bottom: 10px; }
  #detail .box { grid-template-columns: 1fr; }
  #detail .view { min-height: 220px; }
}
</style>
</head>
<body>
<div id="login">
  <form method="post" action="#">
    <h1>Logo board</h1>
    <p id="why">Sign in to open the board.</p>
    <input name="username" autocomplete="username" placeholder="Repository" spellcheck="false">
    <input name="password" type="password" autocomplete="current-password" placeholder="Token">
    <button>Open</button>
  </form>
</div>

<div id="app">
  <nav id="side"></nav>
  <main id="main">
    <header>
      <div class="top"><button id="menu" aria-label="Menu">&#9776;</button><h1 id="title"></h1>
        <div class="chips" id="chips"></div>
        <input id="find" type="search" placeholder="Go to code" autocomplete="off" spellcheck="false"></div>
    </header>
    <div id="content"></div>
  </main>
</div>

<div id="bar"><span id="count"></span><span class="codes" id="codes"></span><span class="codes" style="color:var(--faint)">Space to look</span>
  <button class="btn main" id="copy">Copy codes</button><button class="btn" id="del">Delete</button><button class="btn" id="clear">Clear</button></div>
<div id="detail"><div class="box"><div class="view"><img id="big" alt=""></div><div class="info" id="info"></div></div></div>
<div id="toast"></div>
<div id="ctx"></div>

<script>
// The page names no repository: the repository and a read-only token are typed once (a password manager fills them as
// username and password) and kept in this browser. Files are read through the GitHub API by their git blob sha and
// kept in the browser's cache, so each file is downloaded once until it changes.
(function () {
  var KEY = 'board-access', API = 'https://api.github.com/repos/';
  var access = null; try { access = localStorage.getItem(KEY); } catch (e) {}
  var parts = (access || '').trim().split(/\s+/), token = parts[0], repo = parts[1];
  var $ = function (id) { return document.getElementById(id); };

  function signIn(why) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    $('app').style.display = 'none'; $('login').style.display = 'flex';
    if (why) { $('why').textContent = why; $('why').className = 'why'; }
    var f = $('login').querySelector('form');
    f.onsubmit = function (e) {
      e.preventDefault();
      try { localStorage.setItem(KEY, f.password.value.trim() + ' ' + f.username.value.trim()); } catch (err) {}
      location.reload();
    };
    f.username.focus();
  }
  if (!token || !repo) return signIn('');

  var TYPES = { svg: 'image/svg+xml', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp',
                ico: 'image/x-icon', gif: 'image/gif', json: 'application/json' };
  var head = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw' };
  function refused(r) { if (r.status === 401 || r.status === 403 || r.status === 404) { signIn('The token was refused (expired or without access).'); throw new Error('refused'); } }
  var store = null; try { caches.open('board-blobs').then(function (c) { store = c; }); } catch (e) {}
  var urls = {}, queue = [], running = 0;
  function blob(sha, path) {          // a blob URL of the file, from the cache or the API (six at a time)
    if (urls[sha]) return urls[sha];
    var type = TYPES[path.split('.').pop().toLowerCase()] || 'application/octet-stream';
    var key = 'https://board.local/' + sha;
    urls[sha] = new Promise(function (ok) { queue.push(ok); pump(); }).then(function () {
      var cached = store ? store.match(key) : Promise.resolve(null);
      return cached.then(function (hit) {
        if (hit) return hit.blob();
        return fetch(API + repo + '/git/blobs/' + sha, { headers: head }).then(function (r) {
          refused(r); if (!r.ok) throw new Error(path + ': ' + r.status);
          return r.blob();
        }).then(function (b) { if (store) store.put(key, new Response(b)); return b; });
      });
    }).then(function (b) { running--; pump(); return URL.createObjectURL(b.slice(0, b.size, type)); },
            function (e) { running--; pump(); throw e; });
    return urls[sha];
  }
  function pump() { while (running < 6 && queue.length) { running++; queue.shift()(); } }
  var seen = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var img = e.target; seen.unobserve(img);
      blob(img.dataset.sha, img.dataset.path).then(function (u) { img.src = u; }, function () {});
    });
  }, { rootMargin: '600px' });
  function lazy(img, sha, path) { img.dataset.sha = sha; img.dataset.path = path; seen.observe(img); }

  var data, byCode = {}, picked = [], trash = {}, order = [], marks = {}, state = { view: 'linked-trees', status: 'all' };
  var STATUS = [['all', 'All'], ['live', 'Live'], ['top', 'Top'], ['kept', 'Kept'], ['waiting', 'Waiting'], ['source', 'Sources']];
  var ICONLIKE = { set: 1, proposal: 1 };

  // Deleted items: trash.json in the data repository, {code: time deleted}; the page hides them at once and can
  // restore them. Claude removes the files of items deleted more than a day ago, at its next work on the icons.
  var jhead = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
  var shas = {};                        // the sha of each JSON file as last read, for writing it back
  function readJson(path, empty) {
    return fetch(API + repo + '/contents/' + path, { headers: jhead, cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return { sha: null, content: '' };
      refused(r); if (!r.ok) throw new Error(path + ': ' + r.status); return r.json();
    }).then(function (j) {
      shas[path] = j.sha;
      return j.content ? JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ''))))) : empty;
    });
  }
  function writeJson(path, empty, change, message) {   // re-read, change, write; a second try if someone wrote in between
    var go = function (again) {
      return readJson(path, empty).then(function (obj) {
        obj = change(obj) || obj;
        var body = { message: message, content: btoa(unescape(encodeURIComponent(JSON.stringify(obj, null, 1) + '\n'))) };
        if (shas[path]) body.sha = shas[path];
        return fetch(API + repo + '/contents/' + path, { method: 'PUT', headers: jhead, body: JSON.stringify(body) });
      }).then(function (r) {
        if (r.status === 409 && !again) return go(true);
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
          var e = new Error((j.message || 'error') + ' (' + r.status + ')'); e.readOnly = r.status === 403 || r.status === 404; throw e;
        });
        return r.json().then(function (j) { shas[path] = j.content.sha; });
      });
    };
    return go(false);
  }
  function readTrash() { return readJson('trash.json', {}).then(function (t) { trash = t; }); }
  function writeTrash(change, message) { return writeJson('trash.json', {}, function (t) { change(t); }, message); }
  function remove(codes, undo) {
    var at = new Date().toISOString();
    codes.forEach(function (c) { trash[c] = at; });
    refresh();
    writeTrash(function (t) { codes.forEach(function (c) { t[c] = at; }); }, 'Delete ' + codes.join(', ') + ' (board)').then(function () {
      if (undo !== false) toast('Deleted ' + codes.join(', '), 'Undo', function () { restore(codes); });
    }, function (e) { codes.forEach(function (c) { delete trash[c]; }); refresh(); failed(e); });
  }
  function restore(codes) {
    var was = {}; codes.forEach(function (c) { was[c] = trash[c]; delete trash[c]; });
    refresh();
    writeTrash(function (t) { codes.forEach(function (c) { delete t[c]; }); }, 'Restore ' + codes.join(', ') + ' (board)').then(function () {
      toast('Restored ' + codes.join(', '));
    }, function (e) { codes.forEach(function (c) { trash[c] = was[c]; }); refresh(); failed(e); });
  }
  function failed(e) {
    toast(e.readOnly ? 'Not saved. GitHub says: ' + e.message + '. The token needs Contents: Read and write on the data repository.' : 'Not saved: ' + e.message, 'OK', function () {});
  }
  function refresh() { var y = $('main').scrollTop, z = $('side').scrollTop; side(); show(); $('main').scrollTop = y; $('side').scrollTop = z; }
  function gone(it) { return !!trash[it.code]; }
  // marks.json: the user's own status for an icon (top, kept, waiting), set on the board; Claude makes the set files
  // of a proposal marked kept or top, and moves the marks into board.json, at its next work on the icons
  function st(it) { var m = marks[it.code]; return m && it.status !== 'live' && ICONLIKE[it.kind] ? m : it.status; }
  function mark(codes, to) {
    codes = codes.filter(function (c) { var it = byCode[c.toUpperCase()]; return it && ICONLIKE[it.kind] && it.status !== 'live'; });
    if (!codes.length) return;
    var was = {}; codes.forEach(function (c) { was[c] = marks[c]; var it = byCode[c.toUpperCase()]; if (it.status === to) delete marks[c]; else marks[c] = to; });
    refresh();
    writeJson('marks.json', {}, function (m) {
      codes.forEach(function (c) { if (marks[c]) m[c] = marks[c]; else delete m[c]; });
    }, 'Mark ' + codes.join(', ') + ' ' + to + ' (board)').then(function () {
      toast(codes.join(', ') + ': ' + to, 'Undo', function () {
        codes.forEach(function (c) { if (was[c]) marks[c] = was[c]; else delete marks[c]; }); refresh();
        writeJson('marks.json', {}, function (m) { codes.forEach(function (c) { if (was[c]) m[c] = was[c]; else delete m[c]; }); }, 'Undo mark (board)').catch(failed);
      });
    }, function (e) { codes.forEach(function (c) { if (was[c]) marks[c] = was[c]; else delete marks[c]; }); refresh(); failed(e); });
  }
  // the project list in the user's order (order.json, written by dragging); projects not in it keep their place at the end
  function sortProjects() {
    var at = function (p) { var i = order.indexOf(p.id); return i < 0 ? 1e6 : i; };
    data.projects = data.projects.map(function (p, i) { return [p, i]; })
      .sort(function (a, b) { return at(a[0]) - at(b[0]) || a[1] - b[1]; }).map(function (x) { return x[0]; });
  }
  function moveProject(id, before) {    // before: the id it goes in front of, or null for the end
    var ids = data.projects.map(function (p) { return p.id; }).filter(function (x) { return x !== id; });
    var k = before ? ids.indexOf(before) : ids.length; ids.splice(k < 0 ? ids.length : k, 0, id);
    var old = order; order = ids; sortProjects(); side();
    writeJson('order.json', [], function () { return ids; }, 'Project order (board)').catch(function (e) {
      order = old; sortProjects(); side(); failed(e);
    });
  }

  Promise.all([fetch(API + repo + '/contents/index.json', { headers: head, cache: 'no-store' }).then(function (r) {
    refused(r); if (!r.ok) throw new Error('index.json: ' + r.status); return r.json();
  }), readTrash(), readJson('order.json', []).then(function (o) { order = o; }), readJson('marks.json', {}).then(function (m) { marks = m; })]).then(function (res) {
    var d = res[0];
    data = d; sortProjects(); d.items.forEach(function (it) { byCode[it.code.toUpperCase()] = it; });
    $('login').style.display = 'none'; $('app').style.display = 'flex';
    readHash(); side(); show();
  }).catch(function (e) { if (e.message !== 'refused') { $('content').innerHTML = '<p class="empty">Could not load the board: ' + e.message + '</p>'; $('app').style.display = 'flex'; } });

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function count(f) { return data.items.filter(function (it) { return !gone(it) && f(it); }).length; }

  function side() {
    var s = $('side'); s.innerHTML = '';
    s.appendChild(el('div', 'brand', 'Logo board'));
    function nav(id, label, n, mark) {
      var a = el('button', 'nav' + (state.view === id ? ' on' : ''));
      if (mark) a.appendChild(mark);
      a.appendChild(el('span', '', label)); a.appendChild(el('span', 'n', n));
      a.onclick = function () { state.view = id; state.status = 'all'; document.body.classList.remove('menu'); go(); };
      s.appendChild(a);
      return a;
    }
    nav('live', 'Live on sites', count(function (it) { return st(it) === 'live'; }));
    nav('top', 'Top', count(function (it) { return st(it) === 'top' || st(it) === 'live'; }));
    nav('inspiration', 'Inspiration', count(function (it) { return it.project === 'inspiration'; }));
    var nDel = data.items.filter(gone).length;
    if (nDel || state.view === 'deleted') nav('deleted', 'Deleted', nDel);
    s.appendChild(el('div', 'label', 'Projects'));
    data.projects.forEach(function (p) {
      var a = nav(p.id, p.title, count(function (it) { return it.project === p.id; }));
      a.draggable = true; a.dataset.id = p.id;
      a.ondragstart = function (e) { e.dataTransfer.setData('text/plain', p.id); e.dataTransfer.effectAllowed = 'move'; a.classList.add('drag'); };
      a.ondragend = function () { a.classList.remove('drag'); };
      a.ondragover = function (e) {
        e.preventDefault(); var r = a.getBoundingClientRect(), low = e.clientY > r.top + r.height / 2;
        a.classList.toggle('drop-above', !low); a.classList.toggle('drop-below', low);
      };
      a.ondragleave = function () { a.classList.remove('drop-above', 'drop-below'); };
      a.ondrop = function (e) {
        e.preventDefault(); var id = e.dataTransfer.getData('text/plain'), low = a.classList.contains('drop-below');
        a.classList.remove('drop-above', 'drop-below');
        if (!id || id === p.id) return;
        var i = data.projects.findIndex(function (x) { return x.id === p.id; });
        moveProject(id, low ? (data.projects[i + 1] && data.projects[i + 1].id === id ? (data.projects[i + 2] || {}).id || null : (data.projects[i + 1] || {}).id || null) : p.id);
      };
    });
  }

  function inView() {
    var v = state.view;
    if (v === 'deleted') return data.items.filter(gone);
    return data.items.filter(function (it) {
      if (gone(it)) return false;
      if (v === 'live') return st(it) === 'live';
      if (v === 'top') return st(it) === 'top' || st(it) === 'live';
      return it.project === v;
    });
  }

  function show() {
    var v = state.view, all = inView();
    var p = data.projects.filter(function (p) { return p.id === v; })[0];
    $('title').textContent = p ? p.title + ' · ' + p.prefix : v === 'live' ? 'Live on sites' : v === 'top' ? 'Top' : v === 'deleted' ? 'Deleted' : 'Inspiration';
    var chips = $('chips'); chips.innerHTML = '';
    if (p) STATUS.forEach(function (s) {
      var n = s[0] === 'all' ? all.length : all.filter(function (it) { return st(it) === s[0]; }).length;
      if (!n && s[0] !== 'all') return;
      var c = el('button', 'chip' + (state.status === s[0] ? ' on' : ''), s[1]); c.appendChild(el('span', 'n', n));
      c.onclick = function () { state.status = s[0]; go(); }; chips.appendChild(c);
    });
    var items = state.status === 'all' ? all : all.filter(function (it) { return st(it) === state.status; });
    var box = $('content'); box.innerHTML = ''; $('main').scrollTop = 0;
    if (!items.length) { box.appendChild(el('p', 'empty', 'Nothing here.')); return; }
    var groups = [];
    function group(title, sub, list) { if (list.length) groups.push([title, sub, list]); }
    var desc = function (a, b) { return num(b) - num(a); };
    if (v === 'deleted') {
      group('Deleted', 'removed for good a day after deletion, when Claude next works on the icons', items.slice().sort(function (a, b) { return trash[b.code] < trash[a.code] ? -1 : 1; }));
    } else if (v === 'live' || v === 'top') {
      group(v === 'live' ? 'Each project\u2019s icon on its site now' : 'Live and top sets', '', items);
    } else if (v === 'inspiration') {
      group('Your earlier icons and logos', '', items.filter(function (it) { return it.group === 'own'; }));
      group('Liked', '', items.filter(function (it) { return it.group === 'liked'; }));
    } else {
      group('Live', '', items.filter(function (it) { return st(it) === 'live'; }));
      group('Top', '', items.filter(function (it) { return st(it) === 'top'; }));
      group('Kept', '', items.filter(function (it) { return st(it) === 'kept'; }).sort(desc));
      var wait = items.filter(function (it) { return st(it) === 'waiting'; }), batches = {};
      wait.forEach(function (it) { (batches[it.batch] = batches[it.batch] || []).push(it); });
      Object.keys(batches).map(function (b) { return batches[b]; })
        .sort(function (a, b) { return Math.max.apply(null, b.map(num)) - Math.max.apply(null, a.map(num)); })
        .forEach(function (list) {
          list.sort(function (a, b) { return num(a) - num(b); });
          var lo = list[0].code, hi = list[list.length - 1].code.split('-')[1];
          group('Waiting', list.length > 1 ? lo + ' to ' + hi : lo, list);
        });
      group('Sources', 'images traced or drawn from', items.filter(function (it) { return st(it) === 'source'; }));
    }
    groups.forEach(function (g) {
      var h = el('h2', 'pickable', g[0]); if (g[1]) h.appendChild(el('span', 'sub', g[1])); h.title = 'Select all of these';
      box.appendChild(el('div')).appendChild(h);
      var grid = el('div', 'grid' + (g[2].every(function (it) { return ICONLIKE[it.kind]; }) ? '' : ' free')); g[2].forEach(function (it) { grid.appendChild(card(it)); }); box.appendChild(grid);
      h.onclick = function () {   // the whole group at once; a second click unselects it
        var all = g[2].every(function (it) { return picked.indexOf(it.code) >= 0; });
        g[2].forEach(function (it) {
          if (all === (picked.indexOf(it.code) >= 0)) pick(it.code, grid.querySelector('.card[data-code="' + it.code + '"]'));
        });
        last = g[2][g[2].length - 1].code;
      };
    });
  }
  function num(it) { var m = it.code.match(/(\d+)$/); return m ? +m[1] : 0; }

  function card(it) {
    var c = el('div', 'card' + (ICONLIKE[it.kind] ? ' icon' : '') + (picked.indexOf(it.code) >= 0 ? ' sel' : ''));
    c.dataset.code = it.code;
    var tick = el('span', 'tick'); c.appendChild(tick);
    var m = el('div', 'meta'); c.appendChild(m);   // the code above the icon, as on the sheets
    var pic = el('div', 'pic'), img = el('img'); img.alt = it.code; pic.appendChild(img); c.appendChild(pic);
    lazy(img, it.sha, it.path);
    if (ICONLIKE[it.kind]) {     // the same file again at tab sizes, as on the sheets: no extra download
      var sz = el('div', 'sizes'), a = el('img', 's32'), b = el('img', 's16'); sz.appendChild(a); sz.appendChild(b); c.appendChild(sz);
      img.onload = function () { a.src = img.src; b.src = img.src; };
    }
    m.appendChild(el('span', 'code', it.code));
    var cross = state.view === 'live' || state.view === 'top';
    var t = cross ? (data.projects.filter(function (p) { return p.id === it.project; })[0] || {}).title : !ICONLIKE[it.kind] && it.title;
    if (t) m.appendChild(el('span', 't', t));
    if ((st(it) === 'live' || st(it) === 'top') && !(cross && state.view === 'live')) m.appendChild(el('span', 'badge', st(it)));
    c.onclick = function () { pick(it.code, c); last = it.code; };
    c.oncontextmenu = function (e) { menu(e, it); };
    c.ondblclick = function () { if (picked.indexOf(it.code) < 0) pick(it.code, c); open(it); };
    return c;
  }


  // right-click menu on an icon (Shift + right-click gives the browser's own)
  function file(it) { return blob(it.sha, it.path); }
  function menu(e, it) {
    if (e.shiftKey) return;
    e.preventDefault();
    if (picked.indexOf(it.code) < 0) { $('clear').onclick(); pick(it.code, e.currentTarget); }
    last = it.code;
    var codes = picked.slice(), many = codes.length > 1, box = $('ctx'); box.innerHTML = '';
    box.appendChild(el('div', 'head', many ? codes.length + ' selected' : it.code));
    function item(label, key, fn) { var b = el('button', '', label); if (key) b.appendChild(el('span', 'k', key)); b.onclick = function () { hide(); fn(); }; box.appendChild(b); }
    function line() { box.appendChild(el('hr')); }
    item(many ? 'Copy codes' : 'Copy code', 'C', function () { copy(codes.join(', ')); });
    if (!many) {
      item('Look', 'Space', function () { open(it); });
      item('Open image in new tab', '', function () { file(it).then(function (u) { window.open(u, '_blank'); }); });
      item('Save image', '', function () { file(it).then(function (u) { var a = document.createElement('a'); a.href = u; a.download = it.code + '.' + it.path.split('.').pop(); document.body.appendChild(a); a.click(); a.remove(); }); });
      item('Copy image', '', function () { copyImage(it); });
    }
    var icons = codes.map(function (c) { return byCode[c.toUpperCase()]; }).filter(function (x) { return x && ICONLIKE[x.kind] && x.status !== 'live'; });
    if (icons.length && state.view !== 'deleted') {
      line();
      [['top', 'Top', 'T'], ['kept', 'Kept', 'K'], ['waiting', 'Waiting', 'W']].forEach(function (m) {
        if (icons.every(function (x) { return st(x) === m[0]; })) return;
        if (m[0] === 'waiting' && icons.some(function (x) { return x.kind === 'set'; })) return;
        item('Move to ' + m[1], m[2], function () { mark(codes, m[0]); });
      });
    }
    line();
    if (state.view === 'deleted') item('Restore', '', function () { restore(codes); });
    else item('Delete', 'Del', function () { $('del').onclick(); });
    box.style.display = 'block';
    var w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.min(e.clientX, innerWidth - w - 8) + 'px'; box.style.top = Math.min(e.clientY, innerHeight - h - 8) + 'px';
  }
  function hide() { $('ctx').style.display = 'none'; }
  document.addEventListener('click', function (e) { if (!$('ctx').contains(e.target)) hide(); });
  window.addEventListener('blur', hide); $('main').addEventListener('wheel', hide, { passive: true });
  function copyImage(it) {   // as a 512 px PNG, which every app can paste
    file(it).then(function (u) {
      var img = new Image(); img.onload = function () {
        var c = document.createElement('canvas'), z = 512, r = img.naturalWidth && img.naturalHeight ? img.naturalHeight / img.naturalWidth : 1;
        c.width = z; c.height = Math.round(z * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) {
          navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]).then(function () { toast('Copied ' + it.code); }, function () { toast('Copying images is not allowed in this browser'); });
        }, 'image/png');
      }; img.src = u;
    });
  }
  function pick(code, c) {
    var i = picked.indexOf(code);
    if (i >= 0) picked.splice(i, 1); else picked.push(code);
    if (c) c.classList.toggle('sel', i < 0);
    document.body.classList.toggle('picking', picked.length > 0);
    $('bar').style.display = picked.length ? 'flex' : 'none';
    $('count').textContent = picked.length + ' selected';
    $('del').textContent = state.view === 'deleted' ? 'Restore' : 'Delete';
    $('codes').textContent = picked.join(', ');
  }
  $('copy').onclick = function () { copy(picked.join(', ')); };
  $('del').onclick = function () {
    var codes = picked.slice(), back = state.view === 'deleted';
    $('clear').onclick();
    if (back) restore(codes.filter(function (c) { return trash[c]; })); else remove(codes);
  };
  $('clear').onclick = function () {
    picked = []; document.querySelectorAll('.card.sel').forEach(function (c) { c.classList.remove('sel'); });
    $('bar').style.display = 'none'; document.body.classList.remove('picking');
  };
  function copy(text) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Copied ' + text); },
      function () { prompt('Copy', text); });
  }
  function toast(t, label, act) {
    var e = $('toast'); e.textContent = t; e.style.display = 'block';
    if (label) { var b = el('button', '', label); b.onclick = function () { e.style.display = 'none'; act(); }; e.appendChild(b); }
    clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, label === "OK" ? 15000 : label ? 6000 : 2200);
  }

  function open(it) {
    current = it.code;
    var big = $('big'); big.removeAttribute('src'); blob(it.sha, it.path).then(function (u) { big.src = u; });
    var info = $('info'); info.innerHTML = '';
    var h = el('div', 'head'); h.appendChild(el('span', 'code', it.code));
    if (st(it) === 'live' || st(it) === 'top') h.appendChild(el('span', 'badge', st(it)));
    var x = el('button', 'x', '×'); x.onclick = close; h.appendChild(x); info.appendChild(h);
    var p = data.projects.filter(function (p) { return p.id === it.project; })[0];
    function row(k, v) { if (!v) return; var r = el('div', 'row', k + ' '); r.appendChild(el('b', '', v)); info.appendChild(r); }
    row('Project', p ? p.title : 'Inspiration');
    row('Status', st(it) + (it.where ? ' on ' + it.where : ''));
    row('Name', it.title);
    row('Batch', it.batch ? it.batch + (it.script ? ', made by ' + it.script : '') : '');
    if (ICONLIKE[it.kind]) {
      var tabs = el('div', 'tabs');
      ['light', 'dark'].forEach(function (t) {
        var bar = el('div', 'tabbar ' + t), tab = el('div', 'tab'), i16 = el('img'), i32 = el('img', 'x2');
        tab.appendChild(i16); tab.appendChild(el('span', '', p ? p.title : it.code)); bar.appendChild(tab); bar.appendChild(i32);
        blob(it.sha, it.path).then(function (u) { i16.src = u; i32.src = u; }); tabs.appendChild(bar);
      });
      info.appendChild(tabs);
    }
    if (it.files.length > 1 || !ICONLIKE[it.kind]) {
      var fl = el('div', 'files'); fl.appendChild(el('div', 'row', 'Files'));
      it.files.forEach(function (f) {
        var a = el('a', '', f[0].split('/').pop()); a.onclick = function () {
          blob(f[1], f[0]).then(function (u) { var t = document.createElement('a'); t.href = u; t.download = f[0].split('/').pop(); document.body.appendChild(t); t.click(); t.remove(); });
        }; fl.appendChild(a);
      });
      info.appendChild(fl);
    }
    var acts = el('div', 'acts'), cp = el('button', 'btn main', 'Copy code');
    cp.onclick = function () { copy(it.code); };
    var del = el('button', 'btn', gone(it) ? 'Restore' : 'Delete');
    del.onclick = function () { close(); if (gone(it)) restore([it.code]); else remove([it.code]); };
    acts.appendChild(cp); acts.appendChild(del); info.appendChild(acts);
    if (gone(it)) info.appendChild(el('p', 'note', 'Deleted ' + new Date(trash[it.code]).toLocaleString() + '. Removed for good when Claude next works on the icons, a day after deletion at the earliest.'));
    $('detail').style.display = 'flex';
    history.replaceState(null, '', '#' + state.view + (state.status !== 'all' ? '/' + state.status : '') + '/' + it.code);
  }
  function close() { $('detail').style.display = 'none'; setHash(); }
  $('detail').onclick = function (e) { if (e.target === this) close(); };
  var current = null, last = null;
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape' && $('ctx').style.display === 'block') return hide();
    var open_ = $('detail').style.display === 'flex';
    if (e.key === 'Escape') { if (open_) return close(); if (picked.length) $('clear').onclick(); return; }
    if (e.key === ' ') {         // a quick look, as in the Finder: Space opens the last picked icon, Space again closes
      e.preventDefault();
      if (open_) return close();
      var code = picked.indexOf(last) >= 0 ? last : picked[picked.length - 1];
      if (code && byCode[code.toUpperCase()]) open(byCode[code.toUpperCase()]);
      return;
    }
    if (!open_ && (e.key === 'Delete' || e.key === 'Backspace') && picked.length) { e.preventDefault(); return $('del').onclick(); }
    var mk = { t: 'top', k: 'kept', w: 'waiting' }[e.key.toLowerCase()];
    if (!open_ && mk && picked.length && state.view !== 'deleted') { e.preventDefault(); return mark(picked.slice(), mk); }
    if (!open_ && e.key.toLowerCase() === 'c' && picked.length) { e.preventDefault(); return copy(picked.join(', ')); }
    if (open_ && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      var cards = [].slice.call(document.querySelectorAll('#content .card')), i = cards.findIndex(function (c) { return c.dataset.code === current; });
      var next = cards[i + (e.key === 'ArrowRight' ? 1 : -1)];
      if (next) { e.preventDefault(); open(byCode[next.dataset.code.toUpperCase()]); }
      return;
    }
    if (!open_ && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      var views = ['live', 'top', 'inspiration'].concat(data.items.some(gone) ? ['deleted'] : [], data.projects.map(function (p) { return p.id; }));
      var j = views.indexOf(state.view) + (e.key === 'ArrowDown' ? 1 : -1);
      if (j < 0 || j >= views.length) return;
      e.preventDefault(); state.view = views[j]; state.status = 'all'; go();
      var on = document.querySelector('.nav.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    }
  });
  $('menu').onclick = function () { document.body.classList.toggle('menu'); };
  $('find').onkeydown = function (e) {
    if (e.key !== 'Enter') return;
    var it = byCode[this.value.trim().toUpperCase().replace(/\s+/g, '')];
    if (!it) return toast('No ' + this.value.trim());
    state.view = it.project; state.status = 'all'; go(); open(it); this.value = '';
  };

  function setHash() { history.replaceState(null, '', '#' + state.view + (state.status !== 'all' ? '/' + state.status : '')); }
  function go() { setHash(); side(); show(); }
  function readHash() {
    var h = decodeURIComponent(location.hash.slice(1)).split('/');
    var views = ['live', 'top', 'inspiration', 'deleted'].concat(data.projects.map(function (p) { return p.id; }));
    if (views.indexOf(h[0]) >= 0) state.view = h[0];
    if (STATUS.some(function (s) { return s[0] === h[1]; })) state.status = h[1];
    var code = (h[2] || h[1] || '').toUpperCase();
    if (byCode[code]) setTimeout(function () { open(byCode[code]); }, 0);
  }
})();
